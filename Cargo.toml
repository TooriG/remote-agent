[workspace]
members = [
    "apps/native-focus",
    "apps/native-browser",
    "apps/nsh",
    "crates/agent-core",
    "crates/agent-protocol",
    "crates/agent-transport",
    "crates/agent-local-host",
    "crates/agent-cli",
    "crates/agent-ffi",
    "crates/agent-bindgen",
    "crates/codex-app-server",
    "crates/agent-process",
    "crates/host-daemon",
    "crates/xtask",
    "crates/host-fixture",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98"

# Reuse optimized workspace code between local edits. CI sets CARGO_INCREMENTAL=0.
# Keep the non-incremental release codegen count instead of the incremental default.
[profile.release]
incremental = true
codegen-units = 16

[profile.dev]
debug = "line-tables-only"

# Development Hosts and clients run daily. Unoptimized dependencies keep client
# frames over budget, and debug compression is slow.
[profile.dev.package."*"]
opt-level = 3

# UniFFI's generator runs only while building bindings. Keep its initial compilation cheap.
[profile.dev.package.uniffi_bindgen]
opt-level = 0

[workspace.dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
anyhow = "1.0.104"
dunce = "1.0.5"
base64 = "0.23.1"
futures-util = "0.3.34"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
url = "2.5.8"
zeroize = "1.9.1"

[patch.crates-io]
# UDP rebind recovery: https://github.com/n0-computer/net-tools/pull/235
netwatch = { git = "https://github.com/ttizze/net-tools", rev = "1d54cca14f47ebfa20a75234e8a08351d9f5a8d4" }
alacritty_terminal = { path = "vendor/alacritty_terminal" }
vte = { path = "vendor/vte" }
