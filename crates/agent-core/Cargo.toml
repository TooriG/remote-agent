[package]
name = "agent-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[features]
bindings = ["dep:uniffi", "dep:zeroize"]
diagrams = ["dep:mermaid-rs-renderer", "dep:usvg"]
# The desktop update flow: release downloads and replacing the installed app.
app-updates = ["dep:agent-local-host", "dep:anyhow", "dep:reqwest", "dep:ring", "dep:rustls", "dep:tempfile", "tokio/fs"]

[dependencies]
icu_collator = "=2.4.0"
icu_locale_core = "=2.4.0"
agent-protocol = { path = "../agent-protocol" }
agent-transport = { path = "../agent-transport" }
# Native libraries need scaffolding and the runtime, not Cargo project discovery.
uniffi = { version = "=0.32.2", default-features = false, features = ["tokio"], optional = true }
zeroize = { workspace = true, optional = true }
uuid = { version = "1", features = ["v4", "serde", "v5"] }
futures-util.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-stream = { version = "0.1", default-features = false }
thiserror.workspace = true
scopeguard = "1.2"
markdown = "=1.0.0"
url.workspace = true
percent-encoding = "2.3"
regex = "1.13.1"
# Markdown uses bundled syntax/theme dumps; file loaders and HTML output are unused.
syntect = { version = "=5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
mermaid-rs-renderer = { version = "=0.3.1", default-features = false, optional = true }
# Outlines a diagram's labels with the system's fonts: the SVG renderers that
# draw it may have none.
usvg = { version = "=0.46.0", default-features = false, features = ["text", "system-fonts"], optional = true }
base64.workspace = true
agent-local-host = { path = "../agent-local-host", optional = true }
anyhow = { workspace = true, optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy"], optional = true }
ring = { workspace = true, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
agent-protocol = { path = "../agent-protocol", features = ["test-support"] }
ring.workspace = true
tempfile = "3"
insta = { version = "1.49", default-features = false, features = ["json"] }
proptest = "1.12"
rstest = { version = "0.28", default-features = false }
tokio = { workspace = true, features = ["test-util"] }
