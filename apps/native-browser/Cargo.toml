[package]
name = "native-browser"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
agent-protocol = { path = "../../crates/agent-protocol" }
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
agent-local-host = { path = "../../crates/agent-local-host" }
agent-transport = { path = "../../crates/agent-transport" }
native-focus = { path = "../native-focus" }
anyhow.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
async-channel = "2"
async-task = "=4.7.1"
dispatch2 = "=0.3.1"
futures-util.workspace = true
base64.workspace = true
ring.workspace = true
wry = { version = "=0.57.1", default-features = false }
zeroize.workspace = true
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSResponder", "NSView", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSBundle"] }
block2 = "=0.6.2"
objc2-web-kit = { version = "=0.3.2", features = ["WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKSnapshotConfiguration", "WKHTTPCookieStore", "WKUIDelegate", "WKFrameInfo", "WKNavigationAction", "WKWindowFeatures", "WKOpenPanelParameters"] }
