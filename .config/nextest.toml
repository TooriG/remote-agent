# Decoding and transferring this history fills the runner's CPU and memory.
# Preserve its real request deadlines without competing with other Host tests.
[[profile.default.overrides]]
filter = 'test(=oversized_session_opens_repeatedly_and_downloads_lossless_items_without_reconnecting)'
threads-required = "num-test-threads"

# Conformance cases own both provider processes; conversation cases also use
# four Tokio workers. Preserve RPC deadlines without competing Host startups.
[[profile.default.overrides]]
filter = 'binary(adapter_conformance)'
threads-required = "num-test-threads"

# This contract holds a usage request across credential verification. Reserve
# its real eight-second fetch budget instead of competing with SDK startups.
[[profile.default.overrides]]
filter = 'test(=claude_accounts_login_switch_resume_cancel_and_logout_without_codex)'
threads-required = "num-test-threads"
