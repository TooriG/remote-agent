# ── Approved deviations ─────────────────────────────────────────────────────
# Differences the user approved: the report lists them as approved, not as
# differences. An approval names an `element` or a `group` (the elements whose
# `group` it is); `metrics` (the report's names) narrow it, all when omitted.
# The composer group is the input field, its footer, controls and chips and
# the model picker's popup, in every state; the approval and question panels
# above it are still compared.

[[approved]]
group = "composer"
reason = "composer keeps Bex's own design"
approved = "2026-11-08"
by = "the user"

# The live rows' shimmer: NSH sweeps the label by recolouring its spans on a
# timer (`apps/nsh/src/shimmer.rs`), which the capture cannot list as a Core
# Animation; where the band is when each side is captured decides the
# strongest colour measured.
[[approved]]
group = "live"
metrics = ["animation", "text or glyph colour"]
reason = "a timer-driven shimmer: not a layer animation, and its colour depends on the band's phase at capture"
approved = "2026-11-09"
by = "pending the user's confirmation"

# Bex-only: T3 Code shows a turn's changed files only from its checkpoints,
# which the fixture project does not make; Bex keeps its card.
[[approved]]
group = "bex-only"
metrics = ["present"]
reason = "Bex's changed-files card, kept by the user's decision"
approved = "2026-11-09"
by = "pending the user's confirmation"
