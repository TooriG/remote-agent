[package]
name = "agent-nsh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agent-core = { path = "../../crates/agent-core", features = ["bindings"] }
agent-local-host = { path = "../../crates/agent-local-host" }
agent-protocol = { path = "../../crates/agent-protocol" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util = { workspace = true, features = ["rt"] }
async-channel = "2"
uuid = { version = "1", features = ["v4", "v5"] }
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Lucide's own SVG files, independent of any UI framework.
lucide-static-svg = "=1.70.0"
# v0.4.0: the published iOS crate references the Mac crate's speech.rs,
# which is absent from its crates.io archive. The pinned repository retains it.
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
native-browser = { path = "../native-browser" }
nsh-platform-macos = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3", default-features = false }
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-core-foundation = "=0.3.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPopUpButton", "NSPopUpButtonCell", "NSMenuItemCell", "NSButtonCell", "NSActionCell", "NSCell", "NSSearchField", "NSSwitch", "NSProgressIndicator", "NSToolbarItem", "NSTextField", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPasteboard", "NSPasteboardItem", "NSFontDescriptor", "NSAccessibilityProtocols", "NSApplication", "NSApplicationScripting", "NSBitmapImageRep", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSImageRep", "NSResponder", "NSScreen", "NSView", "NSWindow", "objc2-core-graphics"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }
objc2-quick-look-ui = { version = "=0.3.2", default-features = false, features = ["std", "QLPreviewItem", "QLPreviewPanel", "objc2-app-kit"] }

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3", default-features = false }
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-core-foundation = "=0.3.2"
objc2-ui-kit = { version = "=0.3.2", features = ["objc2-uniform-type-identifiers"] }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
libloading = "=0.8.9"
security-framework = "=3.7.0"
block2 = "=0.6.2"
objc2-uniform-type-identifiers = "=0.3.2"
objc2-avf-audio = { version = "=0.3.2", default-features = false, features = ["std", "block2", "AVAudioApplication", "AVAudioRecorder", "AVAudioFormat", "AVAudioTypes", "AVAudioFile", "AVAudioBuffer", "AVAudioSession", "AVAudioSessionTypes"] }

# Desktop update flow; the iPhone app is updated by its store.
[target.'cfg(not(target_os = "ios"))'.dependencies]
agent-core = { path = "../../crates/agent-core", features = ["app-updates"] }
