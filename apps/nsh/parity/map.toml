[[element]]
id = "sidebar-search-field"
what = "Search field"
kind = "box"
nsh = { text = "Search", class = "NSButton", up = 1 }
gpui = { x = 12, height = 24, source = "sidebar.rs:741 Input::small(): h_6 (sizing.rs:285); Sidebar header px_3 (sidebar/mod.rs:441)" }

[[element]]
id = "sidebar-search-text"
what = "Search field placeholder"
kind = "text"
# The label AppKit's search field draws its placeholder with; the sidebar's
# field is the window's first.
nsh = { class = "_TtC6AppKitP33_72EBFCF981BE77E1C6F26FD717D0893922NSTextFieldSimpleLabel" }
gpui = { source = "sidebar.rs:741 Input::small(), input_text_size text_sm (sizing.rs:248)" }

[[element]]
id = "sidebar-search-icon"
what = "Search icon in the search field"
kind = "icon"
nsh = { text = "Search", class = "NSButton" }
centred_in = "sidebar-search-text"
# Icon and text are both items_center in the field's row: their drawn centres
# meet within a point (a line's ink sits a little above its box's centre).
tolerance = { text = 1.5 }
gpui = { glyph_dy = 0, source = "sidebar.rs:744 prefix(IconName::Search), input.rs:794 items_center: the glyph on the text's centre line" }

[[element]]
id = "sidebar-new-chat"
what = "New chat button"
