[package]
name = "agent-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agent-protocol = { path = "../../crates/agent-protocol" }
agent-transport = { path = "../../crates/agent-transport" }
tracing.workspace = true
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { workspace = true, features = ["fs"] }
tokio-util = { workspace = true, features = ["rt"] }
agent-core = { path = "../../crates/agent-core", features = ["diagrams"] }
agent-local-host = { path = "../../crates/agent-local-host" }
directories = "6"
rfd = "0.17.2"
gpui-kit = { version = "=0.8.1", features = ["tree-sitter-languages"] }
# Keep GPUI icons inside development bundles as well as release bundles.
rust-embed = { version = "8.13", features = ["debug-embed"] }
gpui-http = { package = "gpui-pre-reqwest-client", version = "0.3.10" }
uuid = { version = "1", features = ["v4"] }
serde_json.workspace = true
serde.workspace = true
url.workspace = true
base64.workspace = true
futures-util = { workspace = true, features = ["io"] }
tempfile = "3"
ring.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp", "ico", "pnm"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
async-channel = "2"
similar = { version = "3", features = ["inline"] }
alacritty_terminal = "=0.26.0"
cpal = "0.18.2"
rubato = { version = "5", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[target.'cfg(target_os = "macos")'.dependencies]
wry = { package = "lb-wry", version = "=0.53.3" }
zeroize.workspace = true
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSCell", "NSControl", "NSResponder", "NSView", "NSMenu", "NSMenuItem", "NSImage", "NSGraphics"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSBundle"] }
block2 = "0.6"
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKSnapshotConfiguration", "WKHTTPCookieStore", "WKUIDelegate", "WKFrameInfo", "WKNavigationAction", "WKWindowFeatures", "WKOpenPanelParameters"] }

[dev-dependencies]
gpui-kit = { version = "=0.8.1", features = ["test-support"] }
proptest = "1.12"

[[bin]]
name = "agent-desktop"
path = "src/main.rs"
