name: Production release
on:
  workflow_dispatch:
    inputs:
      nightly-tag:
        description: 'Published Nightly to promote unchanged (empty selects the latest)'
        type: string
        default: ''
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Initialize pinned tooling before loading credentials
        run: scripts/dev-env.sh true
      - name: Load App Store Connect credentials
        env:
          ASC_PRIVATE_KEY: ${{ secrets.BEX_ASC_PRIVATE_KEY }}
        run: |
          umask 077
          key="$RUNNER_TEMP/bex-asc.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key"
          echo "AGENT_ASC_PRIVATE_KEY_FILE=$key" >> "$GITHUB_ENV"
      - id: promote
        name: Promote the approved Nightly without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_ASC_KEY_ID: ${{ secrets.BEX_ASC_KEY_ID }}
          AGENT_ASC_ISSUER_ID: ${{ secrets.BEX_ASC_ISSUER_ID }}
          NIGHTLY_TAG: ${{ inputs.nightly-tag }}
        run: scripts/dev-env.sh node scripts/release-candidate.ts promote "$NIGHTLY_TAG"
      # The public production downloads and external TestFlight are already available.
      # App Review uses the same Apple build and does not gate that promotion.
      - name: Submit the same promoted build to App Review
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_ASC_KEY_ID: ${{ secrets.BEX_ASC_KEY_ID }}
          AGENT_ASC_ISSUER_ID: ${{ secrets.BEX_ASC_ISSUER_ID }}
          PRODUCTION_TAG: ${{ steps.promote.outputs.tag }}
        run: |
          gh release download "$PRODUCTION_TAG" --repo "$GITHUB_REPOSITORY" --pattern release.json --dir "$RUNNER_TEMP/promoted"
          scripts/dev-env.sh node scripts/app-store-release.ts "$RUNNER_TEMP/promoted/release.json"
      - name: Remove App Store credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/bex-asc.p8"
  approvals:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Initialize pinned tooling before loading credentials
        run: scripts/dev-env.sh true
      - name: Load App Store Connect credentials
        env:
          ASC_PRIVATE_KEY: ${{ secrets.BEX_ASC_PRIVATE_KEY }}
        run: |
          umask 077
          key="$RUNNER_TEMP/bex-asc.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key"
          echo "AGENT_ASC_PRIVATE_KEY_FILE=$key" >> "$GITHUB_ENV"
      - name: Publish Nightly builds approved for external TestFlight
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_ASC_KEY_ID: ${{ secrets.BEX_ASC_KEY_ID }}
          AGENT_ASC_ISSUER_ID: ${{ secrets.BEX_ASC_ISSUER_ID }}
        run: scripts/dev-env.sh node scripts/release-candidate.ts sync
      - name: Remove App Store credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/bex-asc.p8"
