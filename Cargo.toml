[workspace]
members = [
    "apps/desktop",
    "crates/agent-core",
    "crates/agent-protocol",
    "crates/agent-transport",
    "crates/agent-local-host",
    "crates/agent-cli",
    "crates/agent-ffi",
    "crates/codex-app-server",
    "crates/agent-process",
    "crates/host-daemon",
    "crates/xtask",
    "crates/host-fixture",
]
exclude = ["vendor/gpui-pre"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98"

[profile.dev]
debug = "line-tables-only"

# GPUI's Windows debug renderer reads HLSL from its build-time Cargo source
# directory. Embed compiled shaders so development packages also run on other PCs.
# This applies to the crate's build script as well; other crates keep assertions.
[profile.dev.package.gpui-pre-windows]
debug-assertions = false

[workspace.dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
anyhow = "1.0.104"
dunce = "1.0.5"
base64 = "0.23.1"
futures-util = "0.3.34"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
url = "2.5.8"
zeroize = "1.9.1"

[patch.crates-io]
# Keep nested cached views reusable when an ancestor is notified.
gpui-pre = { path = "vendor/gpui-pre" }
# UDP rebind recovery: https://github.com/n0-computer/net-tools/pull/235
netwatch = { git = "https://github.com/ttizze/net-tools", rev = "1d54cca14f47ebfa20a75234e8a08351d9f5a8d4" }
alacritty_terminal = { path = "vendor/alacritty_terminal" }
vte = { path = "vendor/vte" }
